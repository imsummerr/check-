<!DOCTYPE html>
<html lang="th">
<head><base target="_top"><?!= include('Style'); ?></head>
<body>
<?!= include('Auth'); ?><?!= include('Common'); ?>
<header>
  <div class="wrap" style="padding:0">
    <h1>📥 ของเข้าครัวกลาง</h1>
    <p>บันทึกของที่เสียบและแพ็คเสร็จแล้ว</p>
  </div>
</header>

<div class="wrap">
  <div id="authBar" class="authbar"></div>

  <div class="card">
    <form id="f" autocomplete="off">
      <label for="item">สินค้า *</label>
      <select id="item" required></select>

      <div class="qtyrow">
        <div>
          <label for="packs" id="packsLabel">แพ็ค</label>
          <input id="packs" type="number" inputmode="numeric" min="0" step="1" placeholder="0">
        </div>
        <div class="plus">+</div>
        <div>
          <label for="rem" id="remLabel">เศษ</label>
          <input id="rem" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
        </div>
      </div>

      <div class="callout" id="calc" style="display:none">
        <div id="calcMain"></div>
        <div class="muted" id="calcSub"></div>
      </div>

      <div class="row">
        <div>
          <label for="date">วันที่เข้า</label>
          <input id="date" type="date">
        </div>
        <div>
          <label for="expiry">วันหมดอายุ</label>
          <input id="expiry" type="date">
        </div>
      </div>
      <p class="hint" id="expHint"></p>

      <label for="note">หมายเหตุ</label>
      <input id="note" placeholder="เช่น ล็อตเช้า">

      <div style="margin-top:16px">
        <button type="submit" class="btn btn-primary" id="submitBtn">บันทึก + แจ้งกลุ่มครัวกลาง</button>
      </div>
    </form>
  </div>

  <div class="center"><a class="link" href="?page=index">← กลับหน้าแรก</a></div>
</div>

<div id="toast" class="toast" style="display:none"></div>

<script>
var D = { items: [], central: '', balances: {} };

function itemOf(n){ for(var i=0;i<D.items.length;i++) if(D.items[i].name===n) return D.items[i]; return null; }
function balOf(n){ var m=D.balances[D.central]||{}; return Number(m[n])||0; }

function syncUnits(){
  var it=itemOf(val('item'));
  if(!it) return;
  document.getElementById('packsLabel').textContent=it.packUnit;
  document.getElementById('remLabel').textContent='เศษ ('+it.subUnit+')';
  document.getElementById('rem').placeholder='0';
  document.getElementById('expHint').textContent =
    it.shelfDays>0 ? ('เว้นว่างไว้ได้ ระบบจะคิดให้ '+it.shelfDays+' วันนับจากวันที่เข้า')
                   : 'สินค้านี้ยังไม่ได้ตั้งอายุเก็บในชีต "รายการสินค้า"';
  autoExpiry();
}

function autoExpiry(){
  var it=itemOf(val('item')), d=val('date');
  if(!it || !d || !it.shelfDays) return;
  var exp=document.getElementById('expiry');
  if(exp.dataset.touched==='1') return;
  var t=new Date(d+'T00:00:00'); t.setDate(t.getDate()+it.shelfDays);
  exp.value=t.toISOString().slice(0,10);
}

function recalc(){
  var it=itemOf(val('item')), box=document.getElementById('calc');
  if(!it){ box.style.display='none'; return; }
  var total=packTotal(it);
  box.style.display='block';
  document.getElementById('calcMain').innerHTML= total>0
    ? ('เข้าสต็อก <strong class="big">'+fmtPack(total,it)+'</strong>')
    : 'กรอกจำนวนที่แพ็คได้';
  var bal=balOf(it.name);
  document.getElementById('calcSub').textContent=
    'คงเหลือครัวกลางตอนนี้ '+fmtPack(bal,it)+
    (total>0 ? (' → จะเป็น '+fmtPack(bal+total,it)) : '');
}

function load(){
  google.script.run.withSuccessHandler(function(d){
    D=d;
    fillItems(document.getElementById('item'), d.items);
    document.getElementById('date').value=new Date().toISOString().slice(0,10);
    syncUnits();
  }).withFailureHandler(function(e){ if(!authExpired(e)) toast('โหลดไม่ได้: '+e.message); })
    .getBootstrap(AUTH.token,'stockin');
}

document.getElementById('item').addEventListener('change', function(){ syncUnits(); recalc(); });
document.getElementById('date').addEventListener('change', function(){ autoExpiry(); });
document.getElementById('expiry').addEventListener('input', function(){ this.dataset.touched='1'; });
['packs','rem'].forEach(function(id){
  document.getElementById(id).addEventListener('input', recalc);
});

document.getElementById('f').addEventListener('submit', function(e){
  e.preventDefault();
  var it=itemOf(val('item'));
  if(!it){ toast('กรุณาเลือกสินค้า'); return; }
  if(!(packTotal(it)>0)){ toast('กรุณากรอกจำนวน'); return; }
  var used=packTotal(it), btn=document.getElementById('submitBtn');
  busy(btn,true,'กำลังบันทึก...');
  google.script.run.withSuccessHandler(function(r){
    busy(btn,false,'บันทึก + แจ้งกลุ่มครัวกลาง');
    var m=D.balances[D.central]||(D.balances[D.central]={});
    m[it.name]=(Number(m[it.name])||0)+used;
    toast('บันทึกแล้ว ✅ '+r.text+'<br>'+(r.lineSent?'แจ้งกลุ่มครัวกลางแล้ว':'⚠️ '+r.lineMsg),4500);
    document.getElementById('packs').value=''; document.getElementById('rem').value='';
    recalc();
  }).withFailureHandler(function(err){
    busy(btn,false,'บันทึก + แจ้งกลุ่มครัวกลาง');
    if(!authExpired(err)) toast('ผิดพลาด: '+err.message,5000);
  }).submitStockIn({ token:AUTH.token, item:it.name,
    packs:val('packs'), rem:val('rem'), date:val('date'),
    expiry:val('expiry'), note:val('note') });
});

authInit(function(u){ authBar(u); load(); });
</script>
</body>
</html>
