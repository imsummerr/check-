<!DOCTYPE html>
<html lang="th">
<head><base target="_top"><?!= include('Style'); ?></head>
<body>
<?!= include('Auth'); ?><?!= include('Common'); ?>
<header>
  <div class="wrap" style="padding:0">
    <h1>📋 เช็คสต็อกรายสัปดาห์</h1>
    <p>นับของจริงแล้วเทียบกับยอดในระบบ</p>
  </div>
</header>

<div class="wrap">
  <div id="authBar" class="authbar"></div>

  <div class="card">
    <label for="loc">นับที่ไหน *</label>
    <select id="loc"></select>
    <p class="hint">ต้องนับให้ครบทุกรายการ — ถ้าไม่มีของเหลือให้ใส่ <strong>0</strong>
      (ยอดในระบบจะถูกปรับให้ตรงกับที่นับได้)</p>
    <div class="callout" id="progress" style="display:none"></div>
  </div>

  <div class="card">
    <div class="tablewrap">
      <table class="count-tbl">
        <thead>
          <tr><th>สินค้า</th><th style="text-align:right">นับได้</th><th>ผลเทียบ</th></tr>
        </thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
    <div id="loading" class="center muted" style="padding:20px">กำลังโหลด...</div>
  </div>

  <div class="card">
    <button class="btn btn-primary" id="submitBtn" type="button">บันทึกผลนับ + แจ้งกลุ่ม</button>
  </div>

  <div class="center"><a class="link" href="?page=index">← กลับหน้าแรก</a></div>
</div>

<div id="toast" class="toast" style="display:none"></div>

<script>
var ROWS = [];

function rowTotal(r){
  var p=parseInt(document.getElementById('p_'+r.i).value,10)||0;
  var e=parseFloat(document.getElementById('r_'+r.i).value)||0;
  return Math.max(0,p)*(Number(r.perPack)||0)+Math.max(0,e);
}
function touched(r){
  return document.getElementById('p_'+r.i).value!=='' || document.getElementById('r_'+r.i).value!=='';
}

function paintRow(r){
  var cell=document.getElementById('d_'+r.i);
  var tr=document.getElementById('tr_'+r.i);
  if(!touched(r)){
    cell.innerHTML='<span class="diff danger">ยังไม่นับ</span>';
    if(tr) tr.style.background='';
    paintProgress();
    return;
  }
  if(tr) tr.style.background='';
  var diff=rowTotal(r)-r.sysBase;
  if(diff===0){
    cell.innerHTML='<span class="diff ok">ตรง ✓</span>';
  } else {
    var t=fmtPack(Math.abs(diff), r);
    cell.innerHTML = diff<0
      ? '<span class="diff danger">ขาด '+t+'</span>'
      : '<span class="diff warn">เกิน '+t+'</span>';
  }
  paintProgress();
}

/** ตัวนับความคืบหน้า + สถานะปุ่ม */
function paintProgress(){
  var box=document.getElementById('progress');
  var done=ROWS.filter(touched).length, all=ROWS.length;
  var btn=document.getElementById('submitBtn');
  if(!all){ box.style.display='none'; return; }
  box.style.display='block';
  if(done===all){
    box.innerHTML='<strong class="ok">✅ นับครบแล้ว '+all+' รายการ</strong>';
    btn.disabled=false; btn.style.opacity='';
  } else {
    box.innerHTML='นับแล้ว <strong>'+done+'</strong> จาก '+all+' รายการ'+
      '<div class="muted" style="font-size:13px">เหลืออีก '+(all-done)+' รายการ — ถ้าไม่มีของให้ใส่ 0</div>';
    btn.disabled=true; btn.style.opacity='.5';
  }
}

function render(rows){
  ROWS=rows.map(function(r,i){ r.i=i; return r; });
  document.getElementById('tb').innerHTML=ROWS.map(function(r){
    return '<tr id="tr_'+r.i+'">'+
      '<td><strong>'+esc(r.name)+'</strong>'+
        '<div class="sys">ระบบ: '+esc(r.sysText)+'</div></td>'+
      '<td style="white-space:nowrap; text-align:right">'+
        '<input id="p_'+r.i+'" type="number" inputmode="numeric" min="0" step="1" placeholder="0" '+
          'aria-label="'+esc(r.name)+' '+esc(r.packUnit)+'"> '+
        '<span class="sys">'+esc(r.packUnit)+'</span><br>'+
        '<input id="r_'+r.i+'" type="number" inputmode="decimal" min="0" step="any" placeholder="0" '+
          'aria-label="'+esc(r.name)+' เศษ '+esc(r.subUnit)+'" style="margin-top:4px"> '+
        '<span class="sys">'+esc(r.subUnit)+'</span>'+
      '</td>'+
      '<td id="d_'+r.i+'"><span class="muted">ยังไม่นับ</span></td>'+
    '</tr>';
  }).join('');
  ROWS.forEach(function(r){
    ['p_','r_'].forEach(function(pre){
      document.getElementById(pre+r.i).addEventListener('input', function(){ paintRow(r); });
    });
  });
  document.getElementById('loading').style.display = ROWS.length ? 'none' : 'block';
  if(!ROWS.length) document.getElementById('loading').textContent='ยังไม่มีสินค้าในระบบ';
  ROWS.forEach(paintRow);
  paintProgress();
}

function loadRows(){
  document.getElementById('loading').style.display='block';
  document.getElementById('loading').textContent='กำลังโหลด...';
  document.getElementById('tb').innerHTML='';
  google.script.run.withSuccessHandler(render)
    .withFailureHandler(function(e){
      if(authExpired(e)) return;
      document.getElementById('loading').textContent='โหลดไม่ได้: '+e.message;
    }).getCountSheet(AUTH.token, val('loc'));
}

function load(){
  google.script.run.withSuccessHandler(function(d){
    fillLocs(document.getElementById('loc'), d.locations);
    loadRows();
  }).withFailureHandler(function(e){ if(!authExpired(e)) toast('โหลดไม่ได้: '+e.message); })
    .getBootstrap(AUTH.token,'count');
}

document.getElementById('loc').addEventListener('change', loadRows);

document.getElementById('submitBtn').addEventListener('click', function(){
  var miss=ROWS.filter(function(r){ return !touched(r); });
  if(miss.length){
    miss.forEach(function(r){
      var tr=document.getElementById('tr_'+r.i);
      if(tr) tr.style.background='#fdeeea';
    });
    var first=document.getElementById('tr_'+miss[0].i);
    if(first) first.scrollIntoView({block:'center', behavior:'smooth'});
    toast('ยังนับไม่ครบ เหลืออีก '+miss.length+' รายการ<br>ถ้าไม่มีของเหลือให้ใส่ 0', 5000);
    return;
  }
  var lines=ROWS.map(function(r){
    return { item:r.name,
             packs:document.getElementById('p_'+r.i).value,
             rem:document.getElementById('r_'+r.i).value };
  });
  var btn=this;
  busy(btn,true,'กำลังบันทึก...');
  google.script.run.withSuccessHandler(function(r){
    busy(btn,false,'บันทึกผลนับ + แจ้งกลุ่ม');
    var msg='บันทึกแล้ว ✅ นับครบ '+r.counted+' รายการ<br>'+
      (r.diffs.length ? ('⚠️ ไม่ตรง '+r.diffs.length+' รายการ — ปรับยอดให้แล้ว')
                      : 'ตรงกับระบบทั้งหมด 🎉');
    toast(msg+'<br>'+(r.lineSent?'แจ้งกลุ่มแล้ว':'⚠️ '+r.lineMsg), 6000);
    loadRows();
  }).withFailureHandler(function(err){
    busy(btn,false,'บันทึกผลนับ + แจ้งกลุ่ม');
    if(!authExpired(err)) toast('ผิดพลาด: '+err.message,5000);
  }).submitCount({ token:AUTH.token, location:val('loc'), lines:lines });
});

authInit(function(u){ authBar(u); load(); });
</script>
</body>
</html>
