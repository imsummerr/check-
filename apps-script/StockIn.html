<!DOCTYPE html>
<html lang="th">
<head><base target="_top"><?!= include('Style'); ?></head>
<body>
<?!= include('Auth'); ?>
<header>
  <div class="wrap" style="padding:0">
    <h1>📥 รับเข้าครัวกลาง</h1>
    <p>บันทึกของที่รับเข้ามาจากซัพพลายเออร์ (ต้นทางสต็อก)</p>
  </div>
</header>

<div class="wrap">
  <div id="authBar" style="display:none; align-items:center; gap:8px; font-size:13px; padding:10px 14px; background:var(--card); border-radius:10px; margin-bottom:14px; box-shadow:var(--shadow)"></div>
  <div class="card">
    <form id="f" autocomplete="off">
      <label for="item">สินค้า *</label>
      <select id="item" required></select>

      <div class="row">
        <div>
          <label for="qty" id="qtyLabel">จำนวน *</label>
          <input id="qty" type="number" inputmode="decimal" min="0" step="any" placeholder="เช่น 10">
        </div>
        <div>
          <label for="unit">หน่วย</label>
          <select id="unit"></select>
        </div>
      </div>

      <div class="callout" id="balBox" style="display:none">
        คงเหลือครัวกลางตอนนี้: <strong id="balNow">–</strong>
        <div class="muted" id="balAfter"></div>
      </div>

      <label for="supplier">ผู้ส่ง / ซัพพลายเออร์</label>
      <input id="supplier" placeholder="ชื่อร้าน/เจ้าที่ส่งของ">

      <label for="note">หมายเหตุ</label>
      <input id="note" placeholder="เช่น ล็อตเช้า / ของสด">

      <div style="margin-top:16px">
        <button type="submit" class="btn btn-primary" id="submitBtn">บันทึกรับเข้า</button>
      </div>
    </form>
  </div>

  <div class="center">
    <a class="link" href="?page=index">📊 ดูสรุป</a> &nbsp;•&nbsp;
    <a class="link" href="?page=entry">📤 ส่งออกไปสาขา</a>
  </div>
</div>

<div id="toast" class="toast" style="display:none"></div>

<script>
var DATA = { items: [], balances: {} };
function toast(msg, ms){ var t=document.getElementById('toast'); t.innerHTML=msg; t.style.display='block';
  clearTimeout(t._h); t._h=setTimeout(function(){t.style.display='none';}, ms||3500); }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function itemOf(n){ for(var i=0;i<DATA.items.length;i++){ if(DATA.items[i].name===n) return DATA.items[i]; } return null; }
function balOf(n){ return Number((DATA.balances||{})[n]||0); }
function fmtQty(q,mu){ q=Number(q)||0;
  if(mu==='ชิ้น') return q+' ชิ้น';
  return Math.abs(q)>=1000 ? (Math.round(q/10)/100+' กก.') : (q+' ก.'); }

function syncUnits(){
  var it=itemOf(document.getElementById('item').value);
  var u=document.getElementById('unit'), lbl=document.getElementById('qtyLabel');
  var prev=u.value; u.innerHTML='';
  if(it && it.measureUnit==='ชิ้น'){
    u.innerHTML='<option value="ชิ้น">ชิ้น</option>'; lbl.textContent='จำนวน (ชิ้น) *';
  } else {
    u.innerHTML='<option value="กิโล">กิโล</option><option value="กรัม">กรัม</option>';
    lbl.textContent='น้ำหนัก *';
    if(prev==='กรัม') u.value='กรัม';
  }
}

function toBase(){
  var it=itemOf(document.getElementById('item').value);
  var n=parseFloat(document.getElementById('qty').value);
  if(!it || !(n>0)) return 0;
  if(it.measureUnit==='ชิ้น') return Math.round(n);
  return document.getElementById('unit').value==='กรัม' ? n : Math.round(n*1000);
}

function recalc(){
  var it=itemOf(document.getElementById('item').value), box=document.getElementById('balBox');
  if(!it){ box.style.display='none'; return; }
  var bal=balOf(it.name), q=toBase();
  document.getElementById('balNow').textContent=fmtQty(bal,it.measureUnit);
  document.getElementById('balAfter').textContent = q>0 ? ('หลังรับเข้าจะเป็น '+fmtQty(bal+q,it.measureUnit)) : '';
  box.style.display='block';
}

function load(){
  google.script.run.withSuccessHandler(function(d){
    DATA=d;
    var it=document.getElementById('item');
    it.innerHTML='<option value="">— เลือกสินค้า —</option>';
    var cats={};
    d.items.forEach(function(x){ (cats[x.category||'อื่น ๆ']=cats[x.category||'อื่น ๆ']||[]).push(x); });
    Object.keys(cats).forEach(function(c){
      var g='<optgroup label="'+esc(c)+'">';
      cats[c].forEach(function(x){
        g+='<option value="'+esc(x.name)+'">'+esc(x.name)+' — '+x.perUnit+' '+esc(x.measureUnit)+'/'+esc(x.sellUnit)+'</option>';
      });
      it.insertAdjacentHTML('beforeend', g+'</optgroup>');
    });
    syncUnits();
  }).withFailureHandler(function(e){ if(!authExpired(e)) toast('โหลดข้อมูลไม่ได้: '+e.message); }).getStockInData(AUTH.token);
}

document.getElementById('item').addEventListener('change', function(){ syncUnits(); recalc(); });
['qty','unit'].forEach(function(id){
  document.getElementById(id).addEventListener('input', recalc);
  document.getElementById(id).addEventListener('change', recalc);
});

document.getElementById('f').addEventListener('submit', function(e){
  e.preventDefault();
  var payload={ token:AUTH.token, item:document.getElementById('item').value,
    qty:document.getElementById('qty').value, inputUnit:document.getElementById('unit').value,
    supplier:document.getElementById('supplier').value.trim(),
    note:document.getElementById('note').value.trim() };
  if(!payload.item){ toast('กรุณาเลือกสินค้า'); return; }
  if(!(parseFloat(payload.qty)>0)){ toast('กรุณากรอกจำนวน'); return; }
  var btn=document.getElementById('submitBtn');
  btn.disabled=true; btn.innerHTML='<span class="spin"></span> กำลังบันทึก...';
  google.script.run.withSuccessHandler(function(res){
    btn.disabled=false; btn.textContent='บันทึกรับเข้า';
    DATA.balances[payload.item]=res.balance;
    toast('รับเข้าแล้ว ✅ • คงเหลือ '+fmtQty(res.balance,res.measureUnit), 4000);
    document.getElementById('qty').value=''; recalc();
  }).withFailureHandler(function(err){
    btn.disabled=false; btn.textContent='บันทึกรับเข้า';
    if(!authExpired(err)) toast('ผิดพลาด: '+err.message, 5000);
  }).submitStockIn(payload);
});

authInit(function(u){ authBar(u); load(); });
</script>
</body>
</html>
