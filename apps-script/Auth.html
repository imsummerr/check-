<!-- ฟอร์มล็อกอินกลาง — include ไฟล์นี้ในทุกหน้า -->
<div id="authGate" style="display:none; position:fixed; inset:0; z-index:100;
     background:var(--bg); overflow:auto; padding:24px 16px">
  <div style="max-width:380px; margin:6vh auto">
    <div class="center" style="margin-bottom:18px">
      <div style="font-size:40px">🌶️</div>
      <div style="font-weight:800; font-size:18px; margin-top:6px">ระบบสต็อกครัวกลางหม่าล่า</div>
      <div class="muted" style="font-size:13px; margin-top:2px">กรุณาเข้าสู่ระบบ</div>
    </div>
    <div class="card">
      <form id="authForm" autocomplete="on">
        <label for="authUser">ชื่อผู้ใช้</label>
        <input id="authUser" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="เช่น kitchen">
        <label for="authPass">รหัสผ่าน</label>
        <input id="authPass" type="password" autocomplete="current-password" placeholder="รหัสผ่าน">
        <div id="authErr" class="danger" style="font-size:14px; margin-top:10px; display:none"></div>
        <div style="margin-top:16px">
          <button type="submit" class="btn btn-primary" id="authBtn">เข้าสู่ระบบ</button>
        </div>
      </form>
    </div>
    <div class="center muted" style="font-size:12px">ลืมรหัสผ่าน? ติดต่อผู้ดูแลระบบ</div>
  </div>
</div>

<script>
var AUTH = { token: '', user: null, _onReady: null };
try { AUTH.token = localStorage.getItem('authToken') || ''; } catch (e) {}

function authSaveToken(t){ AUTH.token=t; try{ localStorage.setItem('authToken',t); }catch(e){} }
function authClearToken(){ AUTH.token=''; try{ localStorage.removeItem('authToken'); }catch(e){} }

function authShow(){
  document.getElementById('authGate').style.display='block';
  setTimeout(function(){ document.getElementById('authUser').focus(); }, 60);
}
function authHide(){ document.getElementById('authGate').style.display='none'; }

/** เรียกตอนเปิดหน้า — ผ่านแล้วค่อยรัน onReady(user) */
function authInit(onReady){
  AUTH._onReady = onReady;
  if(!AUTH.token){ authShow(); return; }
  google.script.run
    .withSuccessHandler(function(u){
      if(u){ AUTH.user=u; authHide(); onReady(u); }
      else { authClearToken(); authShow(); }
    })
    .withFailureHandler(function(){ authClearToken(); authShow(); })
    .me(AUTH.token);
}

/** ใช้ใน withFailureHandler ทุกที่ — คืน true ถ้าเป็นปัญหา session หมดอายุ */
function authExpired(err){
  var m = String((err && err.message) || err || '');
  if(m.indexOf('NOAUTH') >= 0){
    authClearToken(); authShow();
    return true;
  }
  return false;
}

function authLogout(){
  var t=AUTH.token;
  authClearToken();
  if(t) google.script.run.logout(t);
  location.reload();
}

/** แถบชื่อผู้ใช้ + ปุ่มออกจากระบบ (เรียกหลังล็อกอินผ่าน) */
function authBar(u){
  var el=document.getElementById('authBar');
  if(!el) return;
  el.innerHTML='<span class="muted">👤 '+u.name+
    ' <span class="pill">'+u.role+(u.branch?(' · '+u.branch):'')+'</span></span>'+
    '<a href="javascript:authLogout()" class="link" style="margin-left:auto">ออกจากระบบ</a>';
  el.style.display='flex';
}

document.getElementById('authForm').addEventListener('submit', function(e){
  e.preventDefault();
  var btn=document.getElementById('authBtn'), err=document.getElementById('authErr');
  var u=document.getElementById('authUser').value.trim();
  var p=document.getElementById('authPass').value;
  if(!u||!p){ err.textContent='กรุณากรอกให้ครบ'; err.style.display='block'; return; }
  err.style.display='none';
  btn.disabled=true; btn.innerHTML='<span class="spin"></span> กำลังเข้าสู่ระบบ...';
  google.script.run
    .withSuccessHandler(function(res){
      btn.disabled=false; btn.textContent='เข้าสู่ระบบ';
      document.getElementById('authPass').value='';
      authSaveToken(res.token); AUTH.user=res; authHide();
      if(AUTH._onReady) AUTH._onReady(res);
    })
    .withFailureHandler(function(e2){
      btn.disabled=false; btn.textContent='เข้าสู่ระบบ';
      err.textContent=(e2 && e2.message) || 'เข้าสู่ระบบไม่สำเร็จ';
      err.style.display='block';
    })
    .login(u, p);
});
</script>
