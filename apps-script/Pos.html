<!DOCTYPE html>
<html lang="th">
<head><base target="_top"><?!= include('Style'); ?></head>
<body>
<?!= include('Auth'); ?><?!= include('Common'); ?>
<header>
  <div class="wrap" style="padding:0">
    <h1>💵 บันทึกยอด POS</h1>
    <p>ยอดเงินเข้าและส่วนลดของแต่ละวัน</p>
  </div>
</header>

<div class="wrap">
  <div id="authBar" class="authbar"></div>

  <div class="card">
    <form id="f" autocomplete="off">
      <label for="loc">สถานที่ *</label>
      <select id="loc" required></select>

      <label for="date">วันที่ *</label>
      <input id="date" type="date" required>

      <label for="money">ยอดเงินเข้า (บาท) *</label>
      <input id="money" type="number" inputmode="decimal" min="0" step="any" placeholder="เช่น 12500">

      <label for="discount">ส่วนลดที่ให้ไป (บาท)</label>
      <input id="discount" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
      <p class="hint">ส่วนลดจะถูกนำไปหักออกจาก "ยอดที่ควรได้" ตอนคำนวณของหาย</p>

      <label for="note">หมายเหตุ</label>
      <input id="note" placeholder="เช่น วันหยุดยาว">

      <div style="margin-top:16px">
        <button type="submit" class="btn btn-primary" id="submitBtn">บันทึกยอด</button>
      </div>
    </form>
  </div>

  <div class="card">
    <p style="margin:0; font-size:14px; color:var(--muted)">
      🎁 <strong>น้ำจิ้มหรือของที่แถมฟรี</strong> ไม่ต้องกรอกที่นี่ —
      ให้ไปบันทึกที่เมนู <a class="link" href="?page=waste">ของเสีย</a>
      แล้วเลือกประเภทเป็น <strong>"แถมฟรี"</strong> ระบบจะหักออกจากจำนวนของให้เอง
    </p>
  </div>

  <div class="center"><a class="link" href="?page=index">← กลับหน้าแรก</a></div>
</div>

<div id="toast" class="toast" style="display:none"></div>

<script>
function load(){
  google.script.run.withSuccessHandler(function(d){
    fillLocs(document.getElementById('loc'), d.locations);
    document.getElementById('date').value=todayISO();
  }).withFailureHandler(function(e){ if(!authExpired(e)) toast('โหลดไม่ได้: '+e.message); })
    .getBootstrap(AUTH.token,'pos');
}

document.getElementById('f').addEventListener('submit', function(e){
  e.preventDefault();
  var money=parseFloat(val('money'))||0, disc=parseFloat(val('discount'))||0;
  if(!(money>0) && !(disc>0)){ toast('กรุณากรอกยอดเงินเข้า'); return; }
  var btn=document.getElementById('submitBtn');
  busy(btn,true,'กำลังบันทึก...');
  google.script.run.withSuccessHandler(function(r){
    busy(btn,false,'บันทึกยอด');
    toast('บันทึกแล้ว ✅ เงินเข้า '+r.money.toLocaleString()+' บาท'+
      (r.discount?(' • ส่วนลด '+r.discount.toLocaleString()+' บาท'):''), 4000);
    document.getElementById('money').value='';
    document.getElementById('discount').value='';
    document.getElementById('note').value='';
  }).withFailureHandler(function(err){
    busy(btn,false,'บันทึกยอด');
    if(!authExpired(err)) toast('ผิดพลาด: '+err.message,5000);
  }).submitPos({ token:AUTH.token, location:val('loc'), date:val('date'),
    money:money, discount:disc, note:val('note') });
});

authInit(function(u){ authBar(u); load(); });
</script>
</body>
</html>
