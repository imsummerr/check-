<!DOCTYPE html>
<html lang="th">
<head><base target="_top"><?!= include('Style'); ?></head>
<body>
<?!= include('Auth'); ?><?!= include('Common'); ?>
<header>
  <div class="wrap" style="padding:0">
    <h1>🔎 ตรวจเช็คของหาย</h1>
    <p>เทียบของที่ใช้ไปกับเงินที่เข้ามาจริง</p>
  </div>
</header>

<div class="wrap">
  <div id="authBar" class="authbar"></div>

  <div class="card">
    <label for="loc">สถานที่ *</label>
    <select id="loc"></select>
    <div class="row">
      <div><label for="from">ตั้งแต่วันที่</label><input id="from" type="date"></div>
      <div><label for="to">ถึงวันที่</label><input id="to" type="date"></div>
    </div>
    <p class="hint">ระบบจะใช้ "การนับสต็อก" ครั้งล่าสุดก่อนวันเริ่ม เป็นยอดตั้งต้น
      และครั้งล่าสุดในช่วง เป็นยอดปลายงวด</p>
    <div style="margin-top:14px">
      <button class="btn btn-primary" id="runBtn" type="button">ดูรายงาน</button>
    </div>
  </div>

  <div id="out"></div>

  <div class="center"><a class="link" href="?page=index">← กลับหน้าแรก</a></div>
</div>

<div id="toast" class="toast" style="display:none"></div>

<script>
function baht(n){
  n=Number(n)||0;
  return (n<0?'-':'')+Math.abs(n).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function render(r){
  var out=document.getElementById('out');

  var warn = r.noPrice.length
    ? '<div class="callout" style="border-color:#f4d0c8; background:#fdeeea">'+
      '<strong class="danger">⚠️ ยังไม่ได้ตั้งราคา '+r.noPrice.length+' รายการ</strong>'+
      '<div class="muted" style="margin-top:4px">'+esc(r.noPrice.slice(0,8).join(', '))+
      (r.noPrice.length>8?(' และอีก '+(r.noPrice.length-8)):'')+
      '<br>รายการเหล่านี้คิดเป็นเงิน 0 บาท — ใส่ราคาในชีต "รายการสินค้า" ก่อน</div></div>'
    : '';

  var diffClass = r.diff < -0.005 ? 'danger' : (r.diff > 0.005 ? 'warn' : 'ok');
  var diffLabel = r.diff < -0.005 ? 'เงินขาด' : (r.diff > 0.005 ? 'เงินเกิน' : 'ตรงพอดี');

  var summary =
    '<div class="card">'+
      '<h2>📊 สรุปงวด</h2>'+
      '<p class="muted" style="margin-top:0">'+esc(r.loc)+' • นับต้นงวด '+esc(r.baseDateText)+
        ' → นับปลายงวด '+esc(r.endDateText)+
        ' • มียอด POS '+r.posDays+' วัน</p>'+
      warn+
      '<div class="tablewrap"><table><tbody>'+
        '<tr><td>มูลค่าของที่ขายได้</td><td style="text-align:right"><strong>'+baht(r.totalValue)+'</strong></td></tr>'+
        '<tr><td>− ส่วนลดที่ให้ไป</td><td style="text-align:right" class="muted">'+baht(r.discount)+'</td></tr>'+
        '<tr><td><strong>= ยอดที่ควรได้</strong></td><td style="text-align:right"><strong>'+baht(r.expected)+'</strong></td></tr>'+
        '<tr><td>เงินเข้าจริง (POS)</td><td style="text-align:right"><strong>'+baht(r.money)+'</strong></td></tr>'+
      '</tbody></table></div>'+
      '<div class="callout" style="text-align:center; margin-top:14px">'+
        '<div class="muted" style="font-size:13px">ส่วนต่าง</div>'+
        '<div class="big-num '+diffClass+'">'+baht(r.diff)+'</div>'+
        '<div class="'+diffClass+'" style="font-weight:700">'+diffLabel+'</div>'+
      '</div>'+
    '</div>';

  var rows=r.rows.filter(function(x){ return x.sold!==0 || x.inn || x.waste || x.free; });
  var detail =
    '<div class="card">'+
      '<h2>📦 แยกตามสินค้า</h2>'+
      '<p class="hint" style="margin-top:0">ขายได้ = ต้นงวด + เข้า − เสีย − แถม − ปลายงวด (หน่วยย่อย)</p>'+
      '<div class="tablewrap"><table>'+
        '<thead><tr><th>สินค้า</th><th style="text-align:right">ต้นงวด</th>'+
        '<th style="text-align:right">เข้า</th><th style="text-align:right">เสีย</th>'+
        '<th style="text-align:right">แถม</th><th style="text-align:right">ปลายงวด</th>'+
        '<th style="text-align:right">ขายได้</th><th style="text-align:right">มูลค่า</th></tr></thead>'+
        '<tbody>'+ (rows.length ? rows.map(function(x){
          var neg = x.sold<0;
          return '<tr><td><strong>'+esc(x.item)+'</strong>'+
            (x.price? '' : ' <span class="danger" style="font-size:11px">ไม่มีราคา</span>')+
            '<div class="sys">'+esc(x.subUnit)+
              (x.price?(' • '+baht(x.price)+' บ./'+esc(x.subUnit)):'')+'</div></td>'+
            '<td style="text-align:right">'+x.base+'</td>'+
            '<td style="text-align:right">'+x.inn+'</td>'+
            '<td style="text-align:right">'+(x.waste||'–')+'</td>'+
            '<td style="text-align:right">'+(x.free||'–')+'</td>'+
            '<td style="text-align:right">'+x.end+'</td>'+
            '<td style="text-align:right"><strong'+(neg?' class="danger"':'')+'>'+x.sold+'</strong></td>'+
            '<td style="text-align:right">'+baht(x.value)+'</td></tr>';
        }).join('') : '<tr><td colspan="8" class="muted center" style="padding:16px">ไม่มีความเคลื่อนไหวในช่วงนี้</td></tr>')+
      '</tbody></table></div>'+
      (rows.some(function(x){return x.sold<0;})
        ? '<p class="hint danger">ขายได้ติดลบ = ปลายงวดมากกว่าที่ควรมี — เช็คว่าลืมบันทึกของเข้าหรือนับผิด</p>' : '')+
    '</div>';

  out.innerHTML = summary + detail;
}

function run(){
  var btn=document.getElementById('runBtn');
  document.getElementById('out').innerHTML='';
  busy(btn,true,'กำลังคำนวณ...');
  google.script.run.withSuccessHandler(function(r){
    busy(btn,false,'ดูรายงาน'); render(r);
  }).withFailureHandler(function(e){
    busy(btn,false,'ดูรายงาน');
    if(authExpired(e)) return;
    document.getElementById('out').innerHTML=
      '<div class="card"><div class="danger">'+esc(e.message).replace(/\n/g,'<br>')+'</div></div>';
  }).getLossReport(AUTH.token, val('loc'), val('from'), val('to'));
}

function load(){
  google.script.run.withSuccessHandler(function(d){
    fillLocs(document.getElementById('loc'), d.locations);
    var t=new Date(), a=new Date(); a.setDate(a.getDate()-7);
    document.getElementById('to').value=t.toISOString().slice(0,10);
    document.getElementById('from').value=a.toISOString().slice(0,10);
  }).withFailureHandler(function(e){ if(!authExpired(e)) toast('โหลดไม่ได้: '+e.message); })
    .getBootstrap(AUTH.token,'report');
}

document.getElementById('runBtn').addEventListener('click', run);
authInit(function(u){ authBar(u); load(); });
</script>
</body>
</html>
