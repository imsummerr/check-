<!DOCTYPE html>
<html lang="th">
<head><base target="_top"><?!= include('Style'); ?></head>
<body>
<header>
  <div class="wrap" style="padding:0">
    <h1>🌶️ ระบบสต็อกครัวกลางหม่าล่า</h1>
    <p>สรุปของออก – แพ็ค – ของหาย</p>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <a class="btn btn-primary" href="?page=entry" style="text-decoration:none">➕ ครัวกลาง: บันทึกของออกไปสาขา</a>
  </div>

  <div class="card">
    <div class="stats" id="stats"><div class="muted">กำลังโหลด...</div></div>
  </div>

  <div class="card">
    <h2>📊 สรุปแยกตามสินค้า</h2>
    <div class="tablewrap">
      <table>
        <thead><tr><th>สินค้า</th><th>ส่งออก (กก.)</th><th>ควรแพ็ค</th><th>แพ็คได้</th><th>ของหาย</th></tr></thead>
        <tbody id="itemBody"></tbody>
      </table>
    </div>
    <div id="itemEmpty" class="muted center" style="padding:16px; display:none">ยังไม่มีข้อมูล</div>
  </div>

  <div class="card">
    <h2>🧾 รายการล่าสุด</h2>
    <div class="tablewrap">
      <table>
        <thead><tr><th>เวลา</th><th>สินค้า</th><th>ไปสาขา</th><th>สถานะ</th><th>ของหาย</th></tr></thead>
        <tbody id="recentBody"></tbody>
      </table>
    </div>
    <div id="recentEmpty" class="muted center" style="padding:16px; display:none">ยังไม่มีรายการ</div>
  </div>
</div>

<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function kg(g){return (Math.round((Number(g)||0)/10)/100);}

function lossCell(v){
  if(v===''||v==null) return '<span class="muted">–</span>';
  v=Number(v);
  if(v>0) return '<span class="danger">'+v+' ถุง</span>';
  if(v<0) return '<span class="ok">+'+Math.abs(v)+'</span>';
  return '<span class="ok">0</span>';
}

google.script.run.withSuccessHandler(function(d){
  var t=d.totals;
  document.getElementById('stats').innerHTML=
    '<div class="stat"><div class="n">'+kg(t.outG)+'</div><div class="l">ส่งออกรวม (กก.)</div></div>'+
    '<div class="stat"><div class="n">'+t.packedBags+'</div><div class="l">แพ็คได้ (ถุง)</div></div>'+
    '<div class="stat"><div class="n danger">'+t.lossBags+'</div><div class="l">ของหาย (ถุง)</div></div>'+
    '<div class="stat"><div class="n">'+t.n+'</div><div class="l">จำนวนครั้ง</div></div>';

  var ib=document.getElementById('itemBody');
  if(!d.perItem.length){ document.getElementById('itemEmpty').style.display='block'; }
  ib.innerHTML=d.perItem.map(function(o){
    return '<tr><td><strong>'+esc(o.item)+'</strong></td><td>'+kg(o.outG)+'</td><td>'+o.expBags+'</td><td>'+o.packedBags+'</td><td>'+lossCell(o.lossBags)+'</td></tr>';
  }).join('');

  var rb=document.getElementById('recentBody');
  if(!d.recent.length){ document.getElementById('recentEmpty').style.display='block'; }
  rb.innerHTML=d.recent.map(function(r){
    var st=r['สถานะ']==='แพ็คแล้ว'?'<span class="pill done">แพ็คแล้ว</span>':'<span class="pill wait">รอแพ็ค</span>';
    return '<tr><td>'+esc(r['เวลาบันทึก'])+'</td><td>'+esc(r['สินค้า'])+'<br><span class="muted">'+esc(r['ที่กรอก'])+'</span></td><td>'+esc(r['ไปสาขา'])+'</td><td>'+st+'</td><td>'+lossCell(r['ของหาย(ถุง)'])+'</td></tr>';
  }).join('');
}).withFailureHandler(function(e){
  document.getElementById('stats').innerHTML='<div class="danger">โหลดไม่ได้: '+e.message+'</div>';
}).getDashboard();
</script>
</body>
</html>
