<!DOCTYPE html>
<html lang="th">
<head><base target="_top"><?!= include('Style'); ?></head>
<body>
<?!= include('Auth'); ?><?!= include('Common'); ?>
<header>
  <div class="wrap" style="padding:0">
    <h1>🌶️ ระบบสต็อกครัวกลางหม่าล่า</h1>
    <p id="todayLine">—</p>
  </div>
</header>

<div class="wrap">
  <div id="authBar" class="authbar"></div>

  <div class="card">
    <div class="home-grid">
      <a class="home-btn" href="?page=stockin" id="btnIn">📥 ของเข้าครัวกลาง<small>เสียบ+แพ็คเสร็จแล้วลงตรงนี้</small></a>
      <a class="home-btn" href="?page=toshop" id="btnShop">🏪 ของเข้าร้าน<small>ส่งจากครัวกลางไปสาขา</small></a>
      <a class="home-btn alt" href="?page=count">📋 เช็คสต็อกรายสัปดาห์<small>นับจริงเทียบกับระบบ</small></a>
      <a class="home-btn alt" href="?page=waste">🗑️ ของเสีย / ของแถม<small>ตัดออกจากสต็อก</small></a>
      <a class="home-btn alt" href="?page=pos" id="btnPos">💵 บันทึกยอด POS<small>เงินเข้า + ส่วนลด</small></a>
      <a class="home-btn alt" href="?page=report" id="btnReport">🔎 ตรวจเช็คของหาย<small>เทียบของกับเงิน</small></a>
    </div>
  </div>

  <div class="card">
    <h2>⏰ ใกล้หมดอายุ</h2>
    <div id="expBody"></div>
  </div>

  <div class="card">
    <h2>📦 สต็อกคงเหลือ</h2>
    <div id="stockBody"></div>
  </div>
</div>

<div id="toast" class="toast" style="display:none"></div>

<script>
function dayBadge(d){
  if(d<=0) return '<span class="days d0">หมดอายุวันนี้</span>';
  if(d===1) return '<span class="days d1">พรุ่งนี้</span>';
  return '<span class="days dn">อีก '+d+' วัน</span>';
}

function loadDash(){
  google.script.run.withSuccessHandler(function(d){
    document.getElementById('todayLine').textContent='วันนี้ '+d.today;

    var e=document.getElementById('expBody');
    e.innerHTML = d.expiring.length
      ? d.expiring.map(function(x){
          return '<div class="exp-row">'+dayBadge(x.days)+
            '<strong>'+esc(x.item)+'</strong>'+
            '<span class="muted">'+esc(x.qty)+'</span>'+
            '<span class="muted" style="margin-left:auto">'+esc(x.loc)+'</span></div>';
        }).join('')
      : '<div class="muted center" style="padding:14px">ไม่มีของใกล้หมดอายุใน 3 วันนี้ 🎉</div>';

    var s=document.getElementById('stockBody');
    s.innerHTML = d.stock.map(function(L){
      if(!L.rows.length){
        return '<div class="loc-block"><div class="loc-title">'+
          '<span class="pill">'+esc(L.type)+'</span>'+esc(L.name)+'</div>'+
          '<div class="muted" style="font-size:14px">ยังไม่มีของในสต็อก</div></div>';
      }
      return '<div class="loc-block"><div class="loc-title">'+
        '<span class="pill">'+esc(L.type)+'</span>'+esc(L.name)+'</div>'+
        '<div class="tablewrap"><table><tbody>'+
        L.rows.map(function(r){
          var cell = r.low  ? '<span class="danger">'+esc(r.text)+'</span>'
                   : r.warn ? '<span class="warn"><strong>'+esc(r.text)+'</strong></span>'+
                              '<div class="sys warn">⚠️ ต่ำกว่าจุดเตือน '+esc(r.limitText)+'</div>'
                   : '<strong>'+esc(r.text)+'</strong>';
          return '<tr><td>'+esc(r.item)+'</td><td style="text-align:right">'+cell+'</td></tr>';
        }).join('')+'</tbody></table></div></div>';
    }).join('');
  }).withFailureHandler(function(e){
    if(authExpired(e)) return;
    document.getElementById('stockBody').innerHTML='<div class="danger">โหลดไม่ได้: '+e.message+'</div>';
  }).getDashboard(AUTH.token);
}

authInit(function(u){
  authBar(u);
  // ครัวกลาง/แอดมินเท่านั้นที่บันทึกของเข้าครัวกลางและส่งของเข้าร้านได้
  if(u.role==='สาขา'){
    document.getElementById('btnIn').style.display='none';
    document.getElementById('btnShop').style.display='none';
  }
  loadDash();
});
</script>
</body>
</html>
