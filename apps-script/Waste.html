<!DOCTYPE html>
<html lang="th">
<head><base target="_top"><?!= include('Style'); ?></head>
<body>
<?!= include('Auth'); ?><?!= include('Common'); ?>
<header>
  <div class="wrap" style="padding:0">
    <h1>🗑️ ของเสีย</h1>
    <p>บันทึกของที่ทิ้ง — ระบบจะตัดออกจากสต็อกให้</p>
  </div>
</header>

<div class="wrap">
  <div id="authBar" class="authbar"></div>

  <div class="card">
    <form id="f" autocomplete="off">
      <label for="loc">สถานที่ *</label>
      <select id="loc" required></select>

      <label for="item">สินค้า *</label>
      <select id="item" required></select>

      <div class="qtyrow">
        <div>
          <label for="packs" id="packsLabel">แพ็ค</label>
          <input id="packs" type="number" inputmode="numeric" min="0" step="1" placeholder="0">
        </div>
        <div class="plus">+</div>
        <div>
          <label for="rem" id="remLabel">เศษ</label>
          <input id="rem" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
        </div>
      </div>

      <div class="callout" id="calc" style="display:none">
        <div id="calcMain"></div>
        <div class="muted" id="calcSub"></div>
      </div>

      <label for="reason">สาเหตุ</label>
      <select id="reason">
        <option>หมดอายุ</option>
        <option>ของเสีย/เน่า</option>
        <option>ตกพื้น</option>
        <option>ลูกค้าคืน</option>
        <option>อื่น ๆ</option>
      </select>

      <div style="margin-top:16px">
        <button type="submit" class="btn btn-primary" id="submitBtn">บันทึกของเสีย + แจ้งกลุ่ม</button>
      </div>
    </form>
  </div>

  <div class="center"><a class="link" href="?page=index">← กลับหน้าแรก</a></div>
</div>

<div id="toast" class="toast" style="display:none"></div>

<script>
var D = { items: [], locations: [], balances: {} };
function itemOf(n){ for(var i=0;i<D.items.length;i++) if(D.items[i].name===n) return D.items[i]; return null; }
function balAt(loc,n){ var m=D.balances[loc]||{}; return Number(m[n])||0; }

function syncUnits(){
  var it=itemOf(val('item')); if(!it) return;
  document.getElementById('packsLabel').textContent=it.packUnit;
  document.getElementById('remLabel').textContent='เศษ ('+it.subUnit+')';
}

function recalc(){
  var it=itemOf(val('item')), box=document.getElementById('calc');
  if(!it){ box.style.display='none'; return; }
  var total=packTotal(it), bal=balAt(val('loc'), it.name), after=bal-total;
  box.style.display='block';
  document.getElementById('calcMain').innerHTML = total>0
    ? ('ตัดออก <strong class="big danger">'+fmtPack(total,it)+'</strong>')
    : 'กรอกจำนวนของเสีย';
  document.getElementById('calcSub').innerHTML =
    'คงเหลือ '+fmtPack(bal,it)+
    (total>0 ? (' → เหลือ '+fmtPack(after,it) +
      (after<0 ? ' <span class="danger">⚠️ มากกว่าที่มี</span>' : '')) : '');
}

function load(){
  google.script.run.withSuccessHandler(function(d){
    D=d;
    fillLocs(document.getElementById('loc'), d.locations);
    fillItems(document.getElementById('item'), d.items);
    syncUnits();
  }).withFailureHandler(function(e){ if(!authExpired(e)) toast('โหลดไม่ได้: '+e.message); })
    .getBootstrap(AUTH.token,'waste');
}

document.getElementById('item').addEventListener('change', function(){ syncUnits(); recalc(); });
document.getElementById('loc').addEventListener('change', recalc);
['packs','rem'].forEach(function(id){ document.getElementById(id).addEventListener('input', recalc); });

document.getElementById('f').addEventListener('submit', function(e){
  e.preventDefault();
  var it=itemOf(val('item'));
  if(!it){ toast('กรุณาเลือกสินค้า'); return; }
  if(!(packTotal(it)>0)){ toast('กรุณากรอกจำนวน'); return; }
  var loc=val('loc'), used=packTotal(it), btn=document.getElementById('submitBtn');
  busy(btn,true,'กำลังบันทึก...');
  google.script.run.withSuccessHandler(function(r){
    busy(btn,false,'บันทึกของเสีย + แจ้งกลุ่ม');
    var m=D.balances[loc]||(D.balances[loc]={});
    m[it.name]=(Number(m[it.name])||0)-used;
    toast('บันทึกแล้ว ✅ ตัดออก '+r.text+'<br>'+(r.lineSent?'แจ้งกลุ่มแล้ว':'⚠️ '+r.lineMsg),4500);
    document.getElementById('packs').value=''; document.getElementById('rem').value='';
    recalc();
  }).withFailureHandler(function(err){
    busy(btn,false,'บันทึกของเสีย + แจ้งกลุ่ม');
    if(!authExpired(err)) toast('ผิดพลาด: '+err.message,5000);
  }).submitWaste({ token:AUTH.token, item:it.name, location:loc,
    packs:val('packs'), rem:val('rem'), reason:val('reason') });
});

authInit(function(u){ authBar(u); load(); });
</script>
</body>
</html>
